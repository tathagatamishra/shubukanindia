<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shubukan India · Homepage editors</title>
  <style>
    :root { color-scheme: light; color: #282622; background: #f5f3ef; font: 16px/1.55 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 850px; margin: 0 auto; padding: clamp(28px, 8vw, 96px) 24px; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); line-height: 1.1; letter-spacing: -.045em; }
    header > p { margin: 12px 0 24px; color: #625c53; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px; }
    a { color: #244d48; text-underline-offset: 3px; }
    li a {
      display: block; height: 100%; padding: 18px 20px; border: 1px solid #d4cec4; border-radius: 9px; background: #fffcf8;
      text-decoration: none;
    }
    li a:hover { border-color: #286778; background: #fff; }
    a:focus-visible { outline: 2px solid #286778; outline-offset: 3px; }
    h2 { margin: 0; font-size: 19px; }
    li p { margin: 5px 0 0; color: #625c53; font-size: 14px; }
    .back { display: inline-block; margin-bottom: 22px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="back" href="/">Homepage</a>
      <h1>Homepage editors</h1>
      <p>Open an editor on your local Shubukan India preview.</p>
    </header>
    <nav aria-label="Homepage editors">
      <ul>
        <li><a href="/editors/dragon-path">
          <h2>Dragon path editor</h2>
          <p>Shape the flight path, preview the dragon, and edit animation keyframes.</p>
        </a></li>
        <li><a href="/editors/cloud-layout">
          <h2>Cloud layout editor</h2>
          <p>Move, resize, flip, and adjust the opacity of the homepage clouds.</p>
        </a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
